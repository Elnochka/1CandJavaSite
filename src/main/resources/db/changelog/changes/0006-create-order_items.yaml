databaseChangeLog:
  - changeSet:
      id: 0006
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: order_items
      changes:
        - createTable:
            tableName: order_items
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: NUMERIC(15,3)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

#        - addForeignKeyConstraint:
#            baseTableName: order_items
#            baseColumnNames: product_id
#            referencedTableName: products
#            referencedColumnNames: id
#            constraintName: fk_order_items_products

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_orders

      rollback:
        - delete:
            tableName: order_items