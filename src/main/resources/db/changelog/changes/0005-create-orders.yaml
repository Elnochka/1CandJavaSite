databaseChangeLog:
  - changeSet:
      id: 0005
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

#        - addForeignKeyConstraint:
#            baseTableName: orders
#            baseColumnNames: customer_id
#            referencedTableName: customers
#            referencedColumnNames: id
#            constraintName: fk_orders_customers


      rollback:
        - delete:
            tableName: orders